<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161418">
  <meta name="description" content="Blastburrow is a bomb-grid adventure for one to four critters.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Blastburrow">
  <link rel="manifest" href="/app.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" href="/mark.svg">
  <link rel="stylesheet" href="/style.css">
  <title>Blastburrow</title>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="defs" aria-hidden="true">
    <symbol id="i-sprout" viewBox="0 0 24 24"><path d="M12 21v-7c0-5 3-8 9-8 0 6-3 9-9 9M12 15c-5 0-8-3-8-8 5 0 8 3 8 8M8 21h8"/></symbol>
    <symbol id="i-cross" viewBox="0 0 24 24"><path d="m4 4 5 1 9 9-4 4-9-9-1-5Zm10 10L19 4l1 1-1 4-3 3M9 15l-4 4m10-2 4 2 1-1-2-4M4 18l2 2m12-2 2 2"/></symbol>
    <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m15.5 8.5-2 5-5 2 2-5 5-2Z"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2m1-15a3 3 0 0 1 0 6m3 9v-2a4 4 0 0 0-2-3"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5 20v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5m0 6v5h-5m-6 0H4v-5"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3V9Zm13 0a4 4 0 0 1 0 6m2-9a8 8 0 0 1 0 12"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3V9Zm13 1 5 5m0-5-5 5"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-bomb" viewBox="0 0 24 24"><circle cx="10" cy="14" r="6.5"/><path d="m14.5 9.5 2-2m0 0 2 1m-2-1-1-2m4-1 1-1M7.5 13.5a2.5 2.5 0 0 1 2.5-2.5"/></symbol>
    <symbol id="i-keys" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h1m3 0h1m3 0h2m-9 4h8"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2V5Zm6-2v16m6-14v16"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 4h12a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3V4Zm0 13a3 3 0 0 1 3-3h12M8 8h7"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 21V4m0 1c4-4 7 3 13 0v10c-6 3-9-4-13 0"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 12 7-12 7V5Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="8" cy="7" r="2" fill="currentColor"/><circle cx="15" cy="12" r="2" fill="currentColor"/><circle cx="10" cy="17" r="2" fill="currentColor"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5L19 7"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 2v6m0 8v6M2 12h6m8 0h6m-5-5 2-2M5 19l2-2M5 5l2 2m10 10 2 2"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 6v12m6-12v12" stroke-width="3"/></symbol>
  </svg>
  <header class="site-header">
    <div class="shell topbar">
      <button class="brand" id="brand" aria-label="Blastburrow home">
        <img src="/mark.svg" alt="" width="43" height="43">
        <span>Blast<strong>burrow</strong></span>
      </button>
      <nav aria-label="Game modes" class="mode-nav">
        <button class="nav-button active" data-mode="adventure"><svg class="icon"><use href="#i-sprout"/></svg> Adventure</button>
        <button class="nav-button" data-mode="arena"><svg class="icon"><use href="#i-cross"/></svg> Arena</button>
        <button class="nav-button" data-mode="expedition"><svg class="icon"><use href="#i-compass"/></svg> Expeditions</button>
      </nav>
      <div class="top-actions">
        <button class="secondary online-button" id="online-button" aria-label="Play Online"><span class="presence"></span><svg class="icon"><use href="#i-users"/></svg><span>Play Online</span></button>
        <button class="icon-button sound-button" id="sound-button" aria-label="Toggle audio" aria-pressed="false"><svg class="icon"><use href="#i-mute"/></svg></button>
      </div>
    </div>
  </header>
  <main class="shell stage">
    <div class="hero">
      <div class="hero-text">
        <div class="eyebrow"><svg class="icon"><use id="hero-emblem" href="#i-sprout"/></svg><span id="eyebrow">Rootwarren</span><span class="eyebrow-rule"></span><span id="area">The Woodland Burrows</span></div>
        <h1 id="mission-title">Beneath the Bramble</h1>
        <p id="mission-subtitle">Rescue the trapped kits and bring them to the burrow exit.</p>
      </div>
      <div class="party-select" id="local-party" aria-label="Local party size">
        <button class="selected" data-count="1"><svg class="icon"><use href="#i-user"/></svg> Solo</button>
        <button data-count="2"><svg class="icon"><use href="#i-users"/></svg> Local 2P</button>
      </div>
      <button class="secondary" id="online-party" hidden></button>
    </div>
    <div class="game-layout">
      <div class="game-main">
        <section class="game-card" aria-label="Game">
          <div class="game-bar">
            <div class="chamber-label"><span class="status-dot"></span><span id="chamber-label">Chamber 1 of 3</span></div>
            <div class="board-stats" id="board-stats"><span class="hearts">♥</span><span class="hud-divider"></span><span id="hud-clock">06:00</span></div>
            <div class="game-actions">
              <button id="pause-button" class="icon-button" disabled title="Pause" aria-label="Pause"><svg class="icon"><use href="#i-pause"/></svg></button>
              <button id="fullscreen" class="icon-button" title="Fullscreen [F]" aria-label="Fullscreen"><svg class="icon"><use href="#i-expand"/></svg></button>
            </div>
          </div>
          <div class="board-frame" id="board-frame" tabindex="0" aria-label="Game board">
            <canvas id="board" width="720" height="528" aria-label="Top-down burrow"></canvas>
            <div id="board-overlay" class="board-overlay" hidden></div>
          </div>
          <div class="touch-controls" id="touch-controls" role="group" aria-label="Touch controls" hidden>
            <div class="touch-pad" id="touch-pad" role="group" aria-label="Move">
              <button type="button" class="touch-key" data-direction="up" aria-label="Move up"><svg class="icon" aria-hidden="true"><use href="#i-chevron"/></svg></button>
              <button type="button" class="touch-key" data-direction="left" aria-label="Move left"><svg class="icon" aria-hidden="true"><use href="#i-chevron"/></svg></button>
              <button type="button" class="touch-key" data-direction="down" aria-label="Move down"><svg class="icon" aria-hidden="true"><use href="#i-chevron"/></svg></button>
              <button type="button" class="touch-key" data-direction="right" aria-label="Move right"><svg class="icon" aria-hidden="true"><use href="#i-chevron"/></svg></button>
            </div>
            <button type="button" class="touch-bomb" id="touch-bomb"><svg class="icon" aria-hidden="true"><use href="#i-bomb"/></svg>Bomb</button>
          </div>
          <div class="game-footer">
            <div id="game-controls" class="keyboard-summary"></div>
            <p class="touch-summary">Hold the pad to move. Tap Bomb to plant.</p>
            <button id="start-btn" class="primary"><svg class="icon"><use href="#i-play"/></svg><span>Start mission</span></button>
          </div>
        </section>
        <div class="tip-line" id="tip-line"><svg class="icon"><use href="#i-compass"/></svg> <span>Plan your escape before you light the fuse.</span></div>
      </div>
      <aside class="sidebar" aria-label="Mission and profile">
        <section class="panel objective-panel">
          <div class="panel-heading"><span class="panel-icon olive"><svg class="icon"><use href="#i-flag"/></svg></span><div><h2 id="objective-heading">Field objective</h2><p id="objective-kicker">Rescue mission</p></div></div>
          <div class="objective-content" id="objective-content"></div>
        </section>
        <section class="panel route-panel">
          <div class="panel-heading"><span class="panel-icon violet"><svg class="icon"><use href="#i-map"/></svg></span><div><h2 id="route-heading">Burrow trail</h2><p id="route-kicker">Rootwarren</p></div><button class="text-btn" id="map-button">World map <svg class="icon"><use href="#i-chevron"/></svg></button></div>
          <div id="route-content"></div>
        </section>
        <section class="panel profile-panel">
          <div class="profile-row" id="profile-content"></div>
          <div class="xp-track" id="xp-track" role="progressbar" aria-label="Experience toward next level" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="xp-fill"></div></div>
          <div class="profile-footer"><span id="xp-label">0 / 100 XP</span><button class="text-btn" id="journal-button"><svg class="icon"><use href="#i-book"/></svg> Journal</button></div>
        </section>
      </aside>
    </div>
  </main>
  <dialog id="dialog" aria-label="Game menu"><div class="dialog-head"><h2 id="dialog-title"></h2><button class="icon-button" id="dialog-close" aria-label="Close"><svg class="icon"><use href="#i-close"/></svg></button></div><div id="dialog-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/game.js"></script>
</body>
</html>
